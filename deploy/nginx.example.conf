# ─────────────────────────────────────────────────────────────────────
#  NGINX — frontend (statik SPA) + backendga proksi
#
#  Qo'yiladigan joy:
#     /etc/nginx/sites-available/buildings-front
#     ln -s /etc/nginx/sites-available/buildings-front /etc/nginx/sites-enabled/
#
#  ⚠️ BITTA DOMEN — eng sodda va eng ishonchli variant.
#  Frontend va API bitta domenda bo'lsa:
#    • CORS umuman tug'ilmaydi;
#    • `VITE_API_URL` KERAK EMAS — ilova `/api/v1` nisbiy yo'lini
#      ishlatadi (`shared/api/client.ts`);
#    • API manzili o'zgarsa frontendni QAYTA QURISH shart emas.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name buildings.example.uz;          # ← o'z domeningiz

    root /var/www/buildings/buildings-front/dist;
    index index.html;

    # ── API: o'sha domenning /api yo'li backendga ketadi ──
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ Fayl yuklash shu yo'ldan o'tadi. Nginx'ning standart
        # chegarasi 1 MB va usiz 100 MB lik video Node'ga yetib
        # bormasdan `413` oladi — ilova jurnalida esa hech narsa
        # ko'rinmaydi.
        client_max_body_size    110M;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        client_body_timeout     600s;
        proxy_request_buffering off;
    }

    # ── Statik resurslar ──
    # Fayl nomlarida xesh bor (app-a1b2c3.js), shuning uchun abadiy
    # keshlash xavfsiz: mazmun o'zgarsa nom ham o'zgaradi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA ──
    # ⚠️ MAJBURIY. `/objects/123` serverda fayl EMAS. Bu qatorsiz
    # sahifani YANGILAGANDA 404 chiqadi — SPA deploy'da eng ko'p
    # uchraydigan xato.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ `index.html` KESHLANMAYDI. U har deployda yangi `assets/...`
    # fayllariga ishora qiladi; keshlansa, foydalanuvchi eski sahifani
    # ochib, mavjud bo'lmagan fayllarni so'raydi va oq ekran ko'radi.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

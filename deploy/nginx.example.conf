# ─────────────────────────────────────────────────────────────────────
#  NGINX — FRONTEND (statik SPA)
#
#  Domen:  qurilish.mysrv.uz   →  dist/
#  API:    qurilish-api.mysrv.uz  (ALOHIDA domen, alohida server bloki)
#
#  Qo'yiladigan joy:
#     /etc/nginx/sites-available/qurilish
#     ln -s /etc/nginx/sites-available/qurilish /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#
#  HTTPS (bir marta):
#     certbot --nginx -d qurilish.mysrv.uz
#
#  ⚠️ ALOHIDA DOMEN TANLANGANI UCHUN IKKITA SHART BOR:
#     1) frontend `VITE_API_URL=https://qurilish-api.mysrv.uz/api/v1`
#        bilan QURILGAN bo'lishi kerak (yig'ish paytida kodga yoziladi);
#     2) backendda `CORS_ORIGINS=https://qurilish.mysrv.uz`.
#     Bittasi yetishmasa, brauzer so'rovlarni bloklaydi va server
#     jurnalida hech qanday xato ko'rinmaydi.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name qurilish.mysrv.uz;

    root /var/www/buildings/buildings-front/dist;
    index index.html;

    # ── Statik resurslar ──
    # Fayl nomlarida xesh bor (app-a1b2c3.js), shuning uchun abadiy
    # keshlash xavfsiz: mazmun o'zgarsa nom ham o'zgaradi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA ──
    # ⚠️ MAJBURIY. `/objects/123` serverda fayl EMAS. Bu qatorsiz
    # sahifani YANGILAGANDA 404 chiqadi — SPA deploy'da eng ko'p
    # uchraydigan xato.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ `index.html` KESHLANMAYDI. U har deployda yangi `assets/...`
    # fayllariga ishora qiladi; keshlansa, foydalanuvchi eski sahifani
    # ochib, mavjud bo'lmagan fayllarni so'raydi va oq ekran ko'radi.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ─────────────────────────────────────────────────────────────────────
#  MUQOBIL: BITTA DOMEN
#
#  Agar keyinchalik API'ni ham shu domenga olib kelsangiz, quyidagi
#  blokni yuqoridagi `server { … }` ichiga qo'shish yetarli:
#
#     location /api/ {
#         proxy_pass http://127.0.0.1:3333;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         client_max_body_size    110M;
#         proxy_read_timeout      600s;
#         proxy_request_buffering off;
#     }
#
#  Shunda `VITE_API_URL` ni BO'SH qoldirib qayta qurasiz: ilova
#  `/api/v1` nisbiy yo'lini ishlatadi, CORS umuman tug'ilmaydi va
#  backend manzili o'zgarsa frontendni qayta qurish shart emas.
# ─────────────────────────────────────────────────────────────────────
